name: V2 Cloud CI

on:
  push:
    branches:
      - agent/frontend-handbook-v2-phase1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare optimized social image
        run: |
          if [ -f public/og.png ]; then
            node scripts/optimize-og.mjs
            rm public/og.png
          fi
      - name: Upload optimized social image
        uses: actions/upload-artifact@v4
        with:
          name: optimized-social-image
          path: public/og.webp
          if-no-files-found: error
          retention-days: 1
      - name: Run unit and content tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:e2e
