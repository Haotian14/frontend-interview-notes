name: V2 Cloud CI

on:
  push:
    branches:
      - agent/frontend-handbook-v2-phase1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit and content tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Package Sites build
        run: |
          mkdir -p .sites-stage/dist/.openai
          cp -R dist/. .sites-stage/dist/
          cp .openai/hosting.json .sites-stage/dist/.openai/hosting.json
          tar -C .sites-stage -czf sites-v2.tar.gz dist
          tar -tzf sites-v2.tar.gz | grep -qx 'dist/server/index.js'
          tar -tzf sites-v2.tar.gz | grep -qx 'dist/.openai/hosting.json'
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:e2e
      - name: Upload Sites build
        uses: actions/upload-artifact@v4
        with:
          name: sites-v2-package
          path: sites-v2.tar.gz
          if-no-files-found: error
          retention-days: 1
